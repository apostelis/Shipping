version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shipping-postgres
    environment:
      POSTGRES_DB: shipping_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shipping-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shipping_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: smartShippingPlatformSecretKeyForJWTTokenGeneration2024SecureKey
      JAVA_TOOL_OPTIONS: "-Dliquibase.secureParsing=false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: shipping-frontend
    ports:
      - "3000:3000"
    depends_on:
      - app

volumes:
  postgres_data:
    driver: local
